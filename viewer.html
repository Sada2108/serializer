<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open_Forge · Circuit Viewer</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #12151a;
    --line: #23282f;
    --grid: #1a1f26;
    --text: #d8dde3;
    --dim: #6b7480;
    --accent: #4fd1a5;   /* trace-green, reads as "signal live" */
    --warn: #e0a458;
    --mono: "IBM Plex Mono", "SF Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
  }

  body {
    display: flex;
    flex-direction: column;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand .mark {
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .brand .sub {
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--dim);
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--dim);
    transition: background 0.2s ease;
  }
  .dot.live { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot.down { background: #d9636b; box-shadow: 0 0 6px #d9636b; }

  .toolbar {
    display: flex;
    gap: 8px;
  }

  button {
    font-family: var(--mono);
    font-size: 12px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 10px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main {
    flex: 1;
    position: relative;
    padding: 16px 20px 20px;
  }

  .frame-shell {
    height: 100%;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    background: var(--panel);
    position: relative;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #fff; /* runframe's own UI is light by default */
  }

  .fallback {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 24px;
    color: var(--dim);
  }
  .fallback.show { display: flex; }
  .fallback strong { color: var(--warn); font-weight: 500; }
  .fallback code {
    background: var(--grid);
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--text);
  }

  footer {
    padding: 8px 20px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    font-size: 11px;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="mark">Open_Forge</span>
      <span class="sub">circuit viewer</span>
    </div>
    <div class="toolbar">
      <button id="reload">↻ reload</button>
      <button id="open-tab">↗ open in tab</button>
    </div>
    <div class="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">checking localhost:3020…</span>
    </div>
  </header>

  <main>
    <div class="frame-shell">
      <iframe
        id="viewer-frame"
        src="http://localhost:3020"
        title="tscircuit dev server"
        allow="clipboard-write"
      ></iframe>
      <div class="fallback" id="fallback">
        <strong>No signal from localhost:3020</strong>
        <div>Start the dev server in your project directory:</div>
        <code>tsci dev</code>
        <div>then reload this page.</div>
      </div>
    </div>
  </main>

  <footer>
    <span>layer_three · runframe embed</span>
    <span id="clock"></span>
  </footer>

<script>
  const frame = document.getElementById('viewer-frame');
  const dot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const fallback = document.getElementById('fallback');
  const clock = document.getElementById('clock');

  function setLive() {
    dot.className = 'dot live';
    statusText.textContent = 'connected · localhost:3020';
    fallback.classList.remove('show');
  }

  function setDown() {
    dot.className = 'dot down';
    statusText.textContent = 'no response · localhost:3020';
    fallback.classList.add('show');
  }

  // iframes can't reliably report cross-origin load failure via JS alone,
  // so we do a lightweight fetch probe alongside the iframe load event.
  async function probe() {
    try {
      await fetch('http://localhost:3020', { mode: 'no-cors' });
      setLive();
    } catch (e) {
      setDown();
    }
  }

  frame.addEventListener('load', probe);
  probe();
  setInterval(probe, 5000);

  document.getElementById('reload').addEventListener('click', () => {
    frame.src = frame.src;
    probe();
  });

  document.getElementById('open-tab').addEventListener('click', () => {
    window.open('http://localhost:3020', '_blank');
  });

  function tick() {
    clock.textContent = new Date().toLocaleTimeString();
  }
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
