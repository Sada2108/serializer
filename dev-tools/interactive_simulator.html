<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPICE Simulator — {{DESIGN_ID}}</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { margin:0; padding:0; background:#f4f4f4; color:#222; }
  .toolbar { background:#1f1f1f; color:#ddd; padding:6px 10px; display:flex; gap:14px; align-items:center; font-size:12px; }
  .toolbar label { display:flex; align-items:center; gap:4px; cursor:pointer; }
  .toolbar select, .toolbar button { background:#2b2b2b; color:#eee; border:1px solid #3a3a3a; padding:4px 6px; font-size:12px; border-radius:3px; }
  .toolbar button { cursor:pointer; }
  .toolbar input[type="number"] { width:46px; padding:2px 4px; font-size:12px; background:#2b2b2b; color:#eee; border:1px solid #3a3a3a; border-radius:3px; }
  .toolbar .sep { width:1px; height:18px; background:#444; }
  .layout { display:flex; flex-direction:column; height:calc(100vh - 32px); }
  .middle { display:flex; flex:1; min-height:0; }
  .chart-wrap { flex:1; min-width:0; background:#fff; position:relative; border:1px solid #ddd; border-radius:3px; margin:6px; overflow:hidden; }
  .right { width:340px; min-width:340px; max-width:340px; background:#fff; border:1px solid #ddd; border-radius:3px; margin:6px 6px 6px 0; overflow:auto; }
  .right h3 { margin:0; padding:6px 10px; font-size:12px; color:#666; border-bottom:1px solid #ddd; background:#fafafa; text-transform:uppercase; letter-spacing:.5px; }
  .signal-list table { border-collapse:collapse; width:100%; font-size:12px; }
  .signal-list th { background:#f7f7f7; padding:4px 6px; text-align:left; font-weight:600; color:#555; border-bottom:1px solid #ddd; position:sticky; top:0; }
  .signal-list td { padding:3px 6px; border-bottom:1px solid #f2f2f2; font-family:ui-monospace, Menlo, Consolas, monospace; }
  .signal-list td.color-cell { width:18px; padding:3px 4px; }
  .signal-list .swatch { display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:middle; }
  .signal-list input[type="checkbox"] { margin:0; cursor:pointer; }
  .netlist-panel { border-top:1px solid #ddd; }
  .netlist-panel pre { margin:0; padding:8px 10px; font-size:11px; line-height:1.5; overflow:auto; max-height:300px; background:#fafafa; color:#333; white-space:pre-wrap; word-break:break-all; }
  .netlist-toggle { padding:4px 8px; font-size:12px; cursor:pointer; background:#2b2b2b; color:#eee; border:1px solid #3a3a3a; border-radius:3px; margin:6px; }
  .warn-banner { background:#fff3cd; color:#856404; padding:8px 12px; font-size:12px; border-bottom:1px solid #ffc107; }
  .slider-panel { border-bottom:1px solid #ddd; background:#fafafa; padding:8px 12px; display:none; }
  .slider-panel.visible { display:block; }
  .slider-panel h3 { margin:0 0 6px; font-size:11px; color:#666; text-transform:uppercase; letter-spacing:.5px; }
  .slider-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:12px; }
  .slider-row label { min-width:40px; font-weight:600; color:#333; }
  .slider-row input[type="range"] { flex:1; height:4px; }
  .slider-row .val { min-width:80px; text-align:right; font-family:ui-monospace,Menlo,Consolas,monospace; color:#555; font-size:11px; }
  .slider-row .unit { color:#999; font-size:11px; }
  .slider-panel .server-note { font-size:10px; color:#999; margin-top:4px; }
  .slider-panel .server-note.error { color:#c00; }
  .slider-loading { display:inline-block; width:10px; height:10px; border:2px solid #ccc; border-top-color:#333; border-radius:50%; animation:spin .6s linear infinite; margin-left:6px; vertical-align:middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="toolbar">
    <a id="backToSchematic" href="{{SCHEMATIC_FILE}}" style="color:#4fc3f7;text-decoration:none;font-weight:600;margin-right:8px" title="Back to Schematic Editor">\u2190 Schematic</a>
    <div class="sep"></div>
    <label>Analysis:
      <select id="analysisType" onchange="switchAnalysis()">
        <option value="tran" {{TRAN_SELECTED}}>Transient (TRAN)</option>
        <option value="op" {{OP_SELECTED}}>Operating Point (OP)</option>
        <option value="dc" {{DC_SELECTED}}>DC Sweep (DC)</option>
        <option value="ac" {{AC_SELECTED}}>AC Analysis (AC)</option>
        <option value="pz" disabled>Pole-Zero (PZ)</option>
        <option value="noise" disabled>Noise (NOISE)</option>
        <option value="sp" disabled>S-Parameter (SP)</option>
        <option value="fft" {{FFT_SELECTED}}>FFT (Fourier)</option>
      </select>
    </label>
    <div class="sep"></div>
    <label>Start:
      <input type="text" id="tStartInput" value="0" size="8">
    </label>
    <label>End:
      <input type="text" id="tEndInput" value="{{T_END_MS}}m" size="8" placeholder="e.g. 50m">
    </label>
    <button onclick="applyTimeRange()">Apply</button>
    <div class="sep"></div>

    <label><input type="checkbox" id="showGrid" checked onchange="toggleGrid()"> Grid</label>
    <label><input type="checkbox" id="showLegend" checked onchange="toggleLegend()"> Legend</label>
    <div class="sep"></div>
    <span style="color:#999">Fixture: {{DESIGN_ID}}</span>
  </div>

  {{WARN_BANNER}}

  <div class="slider-panel" id="sliderPanel">
    <h3>Component Values <span id="sliderLoading"></span></h3>
    <div id="sliderContainer"></div>
    <div class="server-note" id="serverNote">Requires <code>sim_server.ts</code> running locally (<code>bun run sim_server.ts</code>)</div>
  </div>

  <div class="layout">
    <div class="middle">
      <div class="chart-wrap" id="chart"></div>
      <div class="right">
        <h3>Signals</h3>
        <div class="signal-list">
          <table>
            <thead><tr><th></th><th>Signal</th><th>Type</th><th>Max</th><th>Min</th></tr></thead>
            <tbody id="signalTableBody"></tbody>
          </table>
        </div>
        <div class="netlist-panel">
          <button class="netlist-toggle" onclick="toggleNetlist()">Show / Hide Netlist</button>
          <pre id="netlistPre" style="display:none">{{NETLIST}}</pre>
        </div>
      </div>
    </div>
  </div>

<script>
(function() {
  var probes = {{PROBES_JSON}};

  var PALETTE = [
    "#1f77b4","#d62728","#2ca02c","#ff7f0e","#9467bd",
    "#8c564b","#e377c2","#7f7f7f","#bcbd22","#17becf",
    "#393b79","#637939","#8c6d31","#843c39","#7b4178",
    "#3182bd","#31a354","#756bb1","#636363","#d6616b",
  ];

  var timeData = {{TIME_JSON}};
  var xLabel = "{{X_AXIS_LABEL}}";
  var timeMs = timeData;

  var allTraces = [];
  var visible = [];

  function traceMode(len) { return len > 1 ? "lines" : "lines+markers"; }
  function makeTrace(analysisType, x, probe, i, visible) {
    var isOp = analysisType === "op";
    if (isOp) {
      return { x: [probe.name], y: [probe.values[0]], name: probe.name, type: "bar", visible: true };
    }
    return {
      x: x, y: probe.values, name: probe.name, type: "scatter",
      mode: traceMode(x.length),
      line: { color: PALETTE[i % PALETTE.length], width: 1.5 },
      visible: visible !== undefined ? visible : true,
    };
  }
  probes.forEach(function(p, idx) {
    allTraces.push(makeTrace("{{ANALYSIS_TYPE}}", timeMs, p, idx));
    visible.push(true);
  });

  var layout = buildLayout("{{ANALYSIS_TYPE}}", xLabel);

  var config = {
    responsive: true,
    displayModeBar: true,
    scrollZoom: true,
    modeBarButtonsToRemove: ["lasso2d", "select2d"],
    displaylogo: false,
  };

  Plotly.newPlot("chart", allTraces, layout, config);

  // Signal table
  var tbody = document.getElementById("signalTableBody");
  probes.forEach(function(p, idx) {
    var vals = p.values;
    var max = -Infinity, min = Infinity;
    for (var i = 0; i < vals.length; i++) {
      if (vals[i] > max) max = vals[i];
      if (vals[i] < min) min = vals[i];
    }
    if (!isFinite(max)) max = 0;
    if (!isFinite(min)) min = 0;

    var tr = document.createElement("tr");
    tr.innerHTML =
      '<td class="color-cell"><span class="swatch" style="background:' + p.color + '"></span></td>' +
      '<td><label><input type="checkbox" data-idx="' + idx + '" checked onchange="toggleTrace(this)"> ' + p.name + '</label></td>' +
      '<td>' + p.type + '</td>' +
      '<td>' + max.toFixed(3) + '</td>' +
      '<td>' + min.toFixed(3) + '</td>';
    tbody.appendChild(tr);
  });

  window.toggleTrace = function(cb) {
    var idx = parseInt(cb.getAttribute("data-idx"));
    visible[idx] = cb.checked;
    var vis = visible.map(function(v) { return v ? true : "legendonly"; });
    Plotly.restyle("chart", { visible: vis });
  };

  window.applyTimeRange = function() {
    var tEndRaw = document.getElementById("tEndInput").value.trim();
    if (!tEndRaw) return;
    // Re-run simulation with updated duration (raw ngspice string, e.g. "50m")
    var curAnalysis = document.getElementById("analysisType").value;
    var loading = document.getElementById("sliderLoading");
    loading.innerHTML = '<span class="slider-loading"></span>';

    var body = {
      fixture: "{{DESIGN_ID}}",
      components: getSliderValues(),
      analysisType: curAnalysis,
      duration: tEndRaw,
    };

    fetch(SIM_SERVER + "/simulate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      loading.innerHTML = "";
      if (!data.ok) {
        console.error("Time range simulation error:", data.error);
        loading.textContent = "Error: " + data.error;
        return;
      }
      var newLayout = buildLayout(data.analysisType, data.xAxisLabel);
      var newTraces = data.probes.map(function(p, i) {
        return makeTrace(data.analysisType, data.xValues, p, i, visible[i]);
      });
      while (visible.length < newTraces.length) visible.push(true);
      Plotly.react("chart", newTraces, newLayout, config);
      document.getElementById("netlistPre").textContent = data.netlist;
    })
    .catch(function(e) {
      loading.innerHTML = "";
      console.error("Time range simulation error:", e);
    });
  };

  window.toggleGrid = function() {
    var show = document.getElementById("showGrid").checked;
    var gc = show ? "#e0e0e0" : "transparent";
    Plotly.relayout("chart", {
      "xaxis.gridcolor": gc,
      "yaxis.gridcolor": gc,
    });
  };

  window.toggleLegend = function() {
    var show = document.getElementById("showLegend").checked;
    Plotly.relayout("chart", {
      "showlegend": show,
    });
  };
  window.toggleNetlist = function() {
    var pre = document.getElementById("netlistPre");
    pre.style.display = pre.style.display === "none" ? "block" : "none";
  };

  function buildLayout(analysisType, xLabel) {
    var isAc = analysisType === "ac" || (xLabel && xLabel.indexOf("Frequency") >= 0);
    return {
      margin: { l: 60, r: 20, t: 30, b: 50 },
      xaxis: {
        title: xLabel || "Time (ms)",
        gridcolor: "#e0e0e0",
        zeroline: true,
        zerolinecolor: "#bbb",
        type: isAc ? "log" : "linear",
        autorange: true,
      },
      yaxis: {
        title: isAc ? "Magnitude (dB) / Phase (deg)" : "Voltage (V)",
        gridcolor: "#e0e0e0",
        zeroline: true,
        zerolinecolor: "#bbb",
        autorange: true,
      },
      legend: { orientation: "h", y: -0.15 },
      hovermode: "x unified",
      paper_bgcolor: "#fff",
      plot_bgcolor: "#fff",
    };
  }

  window.switchAnalysis = function() {
    var sel = document.getElementById("analysisType");
    var newType = sel.value;
    var currentType = "{{ANALYSIS_TYPE}}";
    if (newType === currentType) return;

    // Re-run simulation with new analysis type via live server
    var oldText = sel.options[sel.selectedIndex].text;
    sel.options[sel.selectedIndex].text = oldText + " (loading...)";

    var tEndRaw = document.getElementById("tEndInput").value.trim();
    var body = {
      fixture: "{{DESIGN_ID}}",
      components: getSliderValues(),
      analysisType: newType,
      duration: tEndRaw || undefined,
    };

    fetch(SIM_SERVER + "/simulate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      sel.options[sel.selectedIndex].text = oldText;
      if (!data.ok) {
        console.error("Analysis switch error:", data.error);
        sel.value = currentType;
        return;
      }

      currentType = newType;
      var newLayout = buildLayout(data.analysisType, data.xAxisLabel);
      var newTraces = data.probes.map(function(p, i) {
        return makeTrace(data.analysisType, data.xValues, p, i, true);
      });
      visible = newTraces.map(function() { return true; });

      Plotly.newPlot("chart", newTraces, newLayout, config);
      document.getElementById("netlistPre").textContent = data.netlist;

      // Update signal table
      var tbody = document.getElementById("signalTableBody");
      tbody.innerHTML = "";
      data.probes.forEach(function(p, idx) {
        var vals = p.values;
        var max = -Infinity, min = Infinity;
        for (var i = 0; i < vals.length; i++) {
          if (vals[i] > max) max = vals[i];
          if (vals[i] < min) min = vals[i];
        }
        if (!isFinite(max)) max = 0;
        if (!isFinite(min)) min = 0;
        var tr = document.createElement("tr");
        tr.innerHTML =
          '<td class="color-cell"><span class="swatch" style="background:' + p.color + '"></span></td>' +
          '<td><label><input type="checkbox" data-idx="' + idx + '" checked onchange="toggleTrace(this)"> ' + p.name + '</label></td>' +
          '<td>' + p.type + '</td>' +
          '<td>' + max.toFixed(3) + '</td>' +
          '<td>' + min.toFixed(3) + '</td>';
        tbody.appendChild(tr);
      });
    })
    .catch(function(e) {
      sel.options[sel.selectedIndex].text = oldText;
      sel.value = currentType;
      console.error("Switch analysis failed:", e);
    });
  };

  // -----------------------------------------------------------------------
  // Dynamic sliders — backed by sim_server.ts
  // -----------------------------------------------------------------------
  var COMPONENTS = {{COMPONENTS_JSON}};
  var SIM_SERVER = "http://localhost:3777";
  var sliderDebounce = null;

  function initSliders() {
    var panel = document.getElementById("sliderPanel");
    var container = document.getElementById("sliderContainer");
    var note = document.getElementById("serverNote");

    if (!COMPONENTS || COMPONENTS.length === 0) {
      panel.style.display = "none";
      return;
    }

    panel.classList.add("visible");

    COMPONENTS.forEach(function(c) {
      var row = document.createElement("div");
      row.className = "slider-row";

      var label = document.createElement("label");
      label.textContent = c.ref;
      label.title = c.componentType;

      var input = document.createElement("input");
      input.type = "range";
      input.id = "slider_" + c.ref;
      input.dataset.ref = c.ref;
      input.dataset.unit = c.unit;
      input.dataset.logScale = c.logScale ? "1" : "0";
      input.dataset.numericValue = c.numericValue;

      if (c.logScale) {
        // Log-scale slider: min/max in log space
        var logMin = Math.log10(c.min);
        var logMax = Math.log10(c.max);
        input.min = logMin;
        input.max = logMax;
        input.step = (logMax - logMin) / 200;
        input.value = Math.log10(c.numericValue);
      } else {
        input.min = c.min;
        input.max = c.max;
        input.step = c.step;
        input.value = c.numericValue;
      }

      var valSpan = document.createElement("span");
      valSpan.className = "val";
      valSpan.id = "val_" + c.ref;
      valSpan.textContent = c.value;

      var unitSpan = document.createElement("span");
      unitSpan.className = "unit";
      unitSpan.textContent = c.unit;

      row.appendChild(label);
      row.appendChild(input);
      row.appendChild(valSpan);
      row.appendChild(unitSpan);
      container.appendChild(row);

      input.addEventListener("input", function() {
        var logS = input.dataset.logScale === "1";
        var numVal = logS ? Math.pow(10, parseFloat(input.value)) : parseFloat(input.value);
        valSpan.textContent = formatSliderValue(numVal, c.unit);
        debounceSimulate();
      });
    });

    // Check if server is reachable
    fetch(SIM_SERVER + "/fixture/rc_lowpass_001", { method: "GET" })
      .then(function(r) { return r.json(); })
      .then(function() {
        note.textContent = "Server connected (" + SIM_SERVER + ")";
        note.className = "server-note";
      })
      .catch(function() {
        note.innerHTML = "Server not running. Start with: <code>bun run sim_server.ts</code>";
        note.className = "server-note error";
      });
  }

  function formatSliderValue(num, unit) {
    if (unit === "\u03A9") {
      if (num >= 1e6) return (num / 1e6).toFixed(1) + "M";
      if (num >= 1e3) return (num / 1e3).toFixed(1) + "k";
      return num.toFixed(0);
    }
    if (unit === "F") {
      if (num >= 1) return num.toFixed(2);
      if (num >= 1e-3) return (num * 1e3).toFixed(1) + "m";
      if (num >= 1e-6) return (num * 1e6).toFixed(1) + "u";
      if (num >= 1e-9) return (num * 1e9).toFixed(1) + "n";
      return num.toExponential(1);
    }
    if (unit === "H") {
      if (num >= 1) return num.toFixed(2);
      if (num >= 1e-3) return (num * 1e3).toFixed(1) + "m";
      return (num * 1e6).toFixed(1) + "u";
    }
    return num.toFixed(2);
  }

  function getSliderValues() {
    var values = {};
    COMPONENTS.forEach(function(c) {
      var input = document.getElementById("slider_" + c.ref);
      if (!input) return;
      var logS = input.dataset.logScale === "1";
      var numVal = logS ? Math.pow(10, parseFloat(input.value)) : parseFloat(input.value);
      values[c.ref] = formatSliderValue(numVal, c.unit);
    });
    return values;
  }

  function debounceSimulate() {
    if (sliderDebounce) clearTimeout(sliderDebounce);
    sliderDebounce = setTimeout(runSimulation, 250);
  }

  function runSimulation() {
    var loading = document.getElementById("sliderLoading");
    loading.innerHTML = '<span class="slider-loading"></span>';

    var curAnalysis = document.getElementById("analysisType").value;
    var tEndRaw = document.getElementById("tEndInput").value.trim();
    var body = {
      fixture: "{{DESIGN_ID}}",
      components: getSliderValues(),
      analysisType: curAnalysis,
      duration: tEndRaw || undefined,
    };

    fetch(SIM_SERVER + "/simulate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      loading.innerHTML = "";
      if (!data.ok) {
        console.error("Simulation error:", data.error);
        loading.textContent = "Error: " + data.error;
        return;
      }
      // Update chart with new data
      var newLayout = buildLayout(data.analysisType, data.xAxisLabel);
      var newTraces = data.probes.map(function(p, i) {
        return makeTrace(data.analysisType, data.xValues, p, i, visible[i]);
      });

      // Update visible array for new probe count
      while (visible.length < newTraces.length) visible.push(true);

      // Persist layout for future slider updates
      layout = newLayout;
      Plotly.react("chart", newTraces, layout, config);

      // Update netlist display
      document.getElementById("netlistPre").textContent = data.netlist;
    })
    .catch(function(e) {
      loading.innerHTML = "";
      var note = document.getElementById("serverNote");
      note.innerHTML = "Server error: " + e.message + ". Is <code>bun run sim_server.ts</code> running?";
      note.className = "server-note error";
    });
  }

  // Initialize sliders on load
  initSliders();

  // ---- URL param auto-apply (from schematic editor) ----
  // e.g. ?R1=2.2k&C1=100n — sets slider values and triggers re-simulation
  function applyUrlParams() {
    var params = new URLSearchParams(window.location.search);
    if (params.keys().next().done) return;
    var applied = false;
    params.forEach(function(val, ref) {
      var slider = document.getElementById("slider_" + ref);
      if (!slider) return;
      var logS = slider.dataset.logScale === "1";
      var numVal = parseFloat(val);
      if (isNaN(numVal)) {
        // Try parsing SPICE-style values (2.2k, 100n, etc.)
        numVal = parseSpiceValue(val);
      }
      if (isNaN(numVal) || numVal <= 0) return;
      if (logS) {
        slider.value = Math.log10(numVal);
      } else {
        slider.value = numVal;
      }
      var valSpan = document.getElementById("val_" + ref);
      var unit = slider.dataset.unit || "";
      if (valSpan) valSpan.textContent = formatSliderValue(numVal, unit);
      applied = true;
    });
    if (applied) {
      runSimulation();
    }
  }

  function parseSpiceValue(s) {
    s = s.trim().toLowerCase();
    var suffixes = { t:1e12, g:1e9, meg:1e6, k:1e3, m:1e-3, u:1e-6, n:1e-9, p:1e-12, f:1e-15 };
    var suffixesArr = Object.keys(suffixes).sort(function(a,b){ return b.length - a.length; });
    for (var i = 0; i < suffixesArr.length; i++) {
      var suf = suffixesArr[i];
      if (s.endsWith(suf)) {
        var num = parseFloat(s.slice(0, -suf.length));
        return isNaN(num) ? NaN : num * suffixes[suf];
      }
    }
    return parseFloat(s);
  }

  applyUrlParams();
})();
</script>
</body>
</html>
